name: creo-selenium-qa

services:

  frontend:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:4202:80"
    volumes:
      - ../../dist/creo-angular-qa/browser:/usr/share/nginx/html:ro
      - ../../docker/qa/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - qa

  chrome:
    image: selenium/standalone-chrome:4.29.0
    shm_size: 2gb
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:7900:7900"
    environment:
      SE_NODE_MAX_SESSIONS: "1"
      SE_NODE_SESSION_TIMEOUT: "120"
    networks:
      - qa

networks:
  qa:
    external: true
    name: calidad_software_calidad_network
