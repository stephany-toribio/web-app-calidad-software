<div
  *ngIf="!compact"
  (click)="onCardClick()"
  class="rounded-2xl border transition-all flex flex-col cursor-pointer bg-white border-[#E8E3D9] hover:border-[#F2B705] hover:shadow-[0_4px_20px_rgba(242,183,5,0.10)]"
>
  <!-- Header -->
  <div class="p-5 pb-3">
    <div class="flex items-start justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div
          class="w-10 h-10 rounded-xl flex items-center justify-center text-base font-bold flex-shrink-0 text-[#111111]"
          [style.backgroundColor]="avatarBg"
        >
          {{ initial }}
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold truncate text-[#9A948C]">{{ job.company }}</p>
          <p class="text-[15px] font-bold leading-snug mt-0.5 truncate text-[#111111]">{{ job.title }}</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 flex-shrink-0">
        <!-- Bookmark button -->
        <button
          type="button"
          (click)="onSaveClick($event)"
          class="w-8 h-8 rounded-lg flex items-center justify-center transition-colors cursor-pointer"
          [style.color]="saved ? '#F2B705' : '#C4BDB5'"
          [style.backgroundColor]="saved ? '#FEF9C3' : 'transparent'"
          [attr.aria-label]="saved ? 'Quitar de guardados' : 'Guardar oferta'"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" [attr.fill]="saved ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Location + remote chip + level -->
    <div class="flex items-center gap-2 mt-3 flex-wrap">
      <span class="flex items-center gap-1 text-xs text-[#9A948C]">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" />
        </svg>
        {{ job.location }}
      </span>
      <span *ngIf="job.remote" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[#EFF6FF] text-[#1D4ED8]">
        Remoto
      </span>
      <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[#F3F4F6] text-[#374151]">
        {{ job.experience }}
      </span>
      <span *ngIf="job.area" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[#FEF9C3] text-[#854D0E]">
        {{ job.area }}
      </span>
    </div>
  </div>

  <!-- Salary -->
  <div class="px-5 py-2.5 border-t border-b border-[#F5F0E8]">
    <p class="text-sm font-bold text-[#111111]">{{ job.salary }}</p>
  </div>

  <!-- Footer -->
  <div class="px-5 pb-4 mt-auto flex items-center justify-between">
    <div class="flex items-center gap-1.5 text-[11px] text-[#9A948C]">
      <span>{{ job.postedAgo }}</span>
      <span>·</span>
      <span class="font-medium text-[#6B6560]">{{ applicantRange }}</span>
    </div>

    <div class="flex items-center gap-2">
      <span *ngIf="applied" class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-[#DCFCE7] text-[#15803D]">
        Postulado
      </span>
      <button
        type="button"
        (click)="onCardClick()"
        class="text-xs font-semibold px-3 py-1.5 rounded-lg transition-all cursor-pointer bg-[#F2B705] text-[#111111] hover:opacity-90"
      >
        {{ applied ? 'Ver detalle' : 'Ver oferta' }}
      </button>
    </div>
  </div>
</div>

<!-- Compact variant -->
<div
  *ngIf="compact"
  (click)="onCardClick()"
  class="rounded-xl border p-4 cursor-pointer transition-all bg-white border-[#E8E3D9] hover:border-[#F2B705] hover:shadow-[0_0_0_3px_rgba(242,183,5,0.08)]"
>
  <div class="flex items-start gap-3">
    <div
      class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold flex-shrink-0 text-[#111111]"
      [style.backgroundColor]="avatarBg"
    >
      {{ initial }}
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-xs font-medium truncate text-[#9A948C]">{{ job.company }}</p>
      <p class="text-sm font-semibold leading-snug mt-0.5 text-[#111111]">{{ job.title }}</p>
      <div class="flex items-center gap-2 mt-2">
        <span *ngIf="job.remote" class="text-[11px] px-2 py-0.5 rounded-full bg-[#F0F9FF] text-[#0369A1]">
          Remoto
        </span>
        <span class="text-[11px] px-2 py-0.5 rounded-full bg-[#F3F4F6] text-[#374151]">
          {{ job.experience }}
        </span>
      </div>
    </div>
  </div>
  <p class="text-xs mt-2 font-medium text-[#6B6560]">{{ job.salary }}</p>
</div>
