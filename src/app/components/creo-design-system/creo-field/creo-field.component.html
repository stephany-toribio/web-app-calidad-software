    <div class="flex flex-col gap-1.5" style="font-family: Inter, system-ui, sans-serif;">
      <label class="text-sm font-medium flex items-center gap-1" style="color: #111111;">
        {{ label }}
        <span *ngIf="required" class="text-xs font-semibold" style="color: #F2B705;">*</span>
      </label>
      <div class="relative">
        <input
          [type]="type"
          [value]="value"
          [attr.maxlength]="maxLength ? maxLength : null"
          (keypress)="onKeyPress($event)"
          (input)="onInputChange($event)"
          [placeholder]="placeholder"
          class="w-full h-11 px-3.5 rounded-xl border text-sm placeholder:text-slate-400 outline-none transition-all duration-150"
          [style.color]="'#111111'"
          [style.background-color]="error ? '#FEF2F2' : '#FFFFFF'"
          [style.border-color]="error ? '#E5140D' : '#E2E8F0'"
          (focus)="onFocus($event)"
          (blur)="onBlur($event)"
        />
      </div>
      <p *ngIf="error" class="text-xs flex items-center gap-1" style="color: #E5140D;">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" class="flex-shrink-0">
          <circle cx="6" cy="6" r="5.5" stroke="#E5140D" stroke-width="1.2" />
          <path d="M6 4v2.5M6 8h.01" stroke="#E5140D" stroke-width="1.2" stroke-linecap="round" />
        </svg>
        {{ error }}
      </p>
      <p *ngIf="hint && !error" class="text-xs text-slate-400">{{ hint }}</p>
    </div>
