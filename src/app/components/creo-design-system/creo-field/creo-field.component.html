    <div class="flex flex-col gap-1.5" style="font-family: Inter, system-ui, sans-serif;">
      <label class="text-sm font-medium flex items-center gap-1" style="color: #111111;">
        {{ label }}
        <span *ngIf="required" class="text-xs font-semibold" style="color: #F2B705;">*</span>
      </label>
      <div class="relative">
        <input
          [type]="inputType"
          [value]="value"
          [attr.maxlength]="maxLength ? maxLength : null"
          [disabled]="disabled"
    [attr.list]="listId"
          (keypress)="onKeyPress($event)"
          (input)="onInputChange($event)"
          [placeholder]="placeholder"
          class="w-full h-11 pl-3.5 rounded-xl border text-sm placeholder:text-slate-400 outline-none transition-all duration-150 disabled:cursor-not-allowed"
          [class.pr-10]="type === 'password'"
          [class.pr-3.5]="type !== 'password'"
          [style.color]="disabled ? '#94A3B8' : '#111111'"
          [style.background-color]="disabled ? '#F1F5F9' : (error ? '#FEF2F2' : '#FFFFFF')"
          [style.border-color]="error ? '#E5140D' : '#E2E8F0'"
          (focus)="onFocus($event)"
          (blur)="onBlur($event)"
        />
        <button *ngIf="type === 'password'" type="button" (click)="togglePassword()"
          [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
          <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
            </path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
      <p *ngIf="error" class="text-xs flex items-center gap-1" style="color: #E5140D;">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" class="flex-shrink-0">
          <circle cx="6" cy="6" r="5.5" stroke="#E5140D" stroke-width="1.2" />
          <path d="M6 4v2.5M6 8h.01" stroke="#E5140D" stroke-width="1.2" stroke-linecap="round" />
        </svg>
        {{ error }}
      </p>
      <p *ngIf="hint && !error" class="text-xs text-slate-400">{{ hint }}</p>
    </div>
