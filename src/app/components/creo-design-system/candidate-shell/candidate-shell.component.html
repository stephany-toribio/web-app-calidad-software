<div class="min-h-screen" style="background-color: #F8FAFC; font-family: Inter, system-ui, sans-serif;">
  <!-- Top bar -->
  <header class="bg-white border-b sticky top-0 z-20" style="border-color: #E2E8F0;">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 h-14 flex items-center justify-between">
      <!-- Left: Logo & Badge -->
      <div class="flex items-center gap-4">
        <app-creo-wordmark size="sm"></app-creo-wordmark>
        <div class="hidden sm:flex items-center gap-1.5 h-5">
          <div class="w-px h-full" style="background-color: #E2E8F0;"></div>
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full uppercase tracking-wider"
                style="background-color: #F2B705; color: #111111;">
            Candidato
          </span>
        </div>
      </div>
      
      <!-- Right: User Email & Logout -->
      <div class="flex items-center gap-3">
        <span class="text-xs hidden sm:flex items-center h-full" style="color: #64748B;">valeria.rojas&#64;ejemplo.com</span>
        <button (click)="logout()"
                class="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-lg border transition-colors group"
                style="color: #64748B; border-color: #E2E8F0; hover:background-color: #F8FAFC;">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M7.5 9L4.5 6l3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Salir
        </button>
      </div>
    </div>

    <!-- Nav tabs -->
    <nav class="max-w-6xl mx-auto px-5 sm:px-8 flex gap-0 overflow-x-auto" style="scrollbar-width: none;">
      <button *ngFor="let item of nav"
              (click)="navigate(item.id)"
              class="flex-shrink-0 px-4 py-2.5 text-sm font-medium border-b-2 transition-colors cursor-pointer whitespace-nowrap hover:text-[#111111]"
              [style.border-bottom-color]="activeScreen === item.id ? '#F2B705' : 'transparent'"
              [style.color]="activeScreen === item.id ? '#111111' : '#64748B'"
              style="background-color: transparent;">
        
        <div class="flex items-center gap-2">
          <!-- Icons -->
          <svg *ngIf="item.icon === 'home'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <svg *ngIf="item.icon === 'search'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <svg *ngIf="item.icon === 'briefcase'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          <svg *ngIf="item.icon === 'bookmark'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          <svg *ngIf="item.icon === 'user'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          
          {{ item.label }}
        </div>
      </button>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-5 sm:px-8 py-8 pb-24">
    <ng-content></ng-content>
  </main>
</div>
