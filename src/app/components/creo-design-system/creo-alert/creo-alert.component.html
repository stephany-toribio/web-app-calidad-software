    <div
      class="flex items-center gap-2.5 px-4 py-3 rounded-xl border text-sm font-medium"
      [style.font-family]="'Inter, system-ui, sans-serif'"
      [style.background-color]="cfg.bg"
      [style.border-color]="cfg.border"
      [style.color]="cfg.text"
    >
      <ng-container [ngSwitch]="type">
        <svg *ngSwitchCase="'error'" width="14" height="14" viewBox="0 0 14 14" fill="none" class="flex-shrink-0">
          <circle cx="7" cy="7" r="6.5" [attr.stroke]="cfg.iconStroke" stroke-width="1.2" />
          <path d="M7 4.5v3M7 9.5h.01" [attr.stroke]="cfg.iconStroke" stroke-width="1.2" stroke-linecap="round" />
        </svg>
        <svg *ngSwitchCase="'success'" width="14" height="14" viewBox="0 0 14 14" fill="none" class="flex-shrink-0">
          <circle cx="7" cy="7" r="6.5" [attr.stroke]="cfg.iconStroke" stroke-width="1.2" />
          <path d="M4.5 7l2 2 3-3" [attr.stroke]="cfg.iconStroke" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg *ngSwitchDefault width="14" height="14" viewBox="0 0 14 14" fill="none" class="flex-shrink-0">
          <circle cx="7" cy="7" r="6.5" [attr.stroke]="cfg.iconStroke" stroke-width="1.2" />
          <path d="M7 6.5v3M7 4.5h.01" [attr.stroke]="cfg.iconStroke" stroke-width="1.2" stroke-linecap="round" />
        </svg>
      </ng-container>
      {{ message }}
    </div>
