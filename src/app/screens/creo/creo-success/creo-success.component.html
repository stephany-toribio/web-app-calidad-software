<div class="min-h-screen flex flex-col" style="background-color: #FFFFFF; font-family: Inter, system-ui, sans-serif;">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-xl mx-auto px-5 h-16 flex items-center">
      <app-creo-wordmark size="sm"></app-creo-wordmark>
    </div>
  </header>

  <div class="flex-1 flex items-center justify-center px-5 py-16">
    <div class="w-full max-w-md text-center">
      <div class="flex justify-center mb-8">
        <div class="relative">
          <div class="w-24 h-24 rounded-2xl flex items-center justify-center border"
            style="background-color: #F0ECD8; border-color: #E8E3CC;">
            <!-- Ícono candidato -->
            <svg *ngIf="role === 'candidate'" width="44" height="44" viewBox="0 0 44 44" fill="none">
              <circle cx="22" cy="16" r="7" stroke="#111111" stroke-width="2" />
              <path d="M8 40c0-7.732 6.268-14 14-14s14 6.268 14 14" stroke="#111111" stroke-width="2"
                stroke-linecap="round" />
            </svg>
            <!-- Ícono empresa -->
            <svg *ngIf="role === 'company'" width="44" height="44" viewBox="0 0 44 44" fill="none">
              <rect x="6" y="20" width="32" height="20" rx="3" stroke="#111111" stroke-width="2" />
              <path d="M14 20V16a8 8 0 0116 0v4" stroke="#111111" stroke-width="2" stroke-linecap="round" />
              <rect x="18" y="28" width="8" height="6" rx="1" stroke="#111111" stroke-width="1.5" />
            </svg>
          </div>
          <div
            class="absolute -bottom-2 -right-2 w-9 h-9 rounded-full flex items-center justify-center border-2 border-white shadow-sm"
            style="background-color: #F2B705;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3 8l3.5 3.5 6.5-7" stroke="#111111" stroke-width="2.2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </div>
        </div>
      </div>

      <h1 class="text-3xl font-bold tracking-tight mb-3" style="color: #111111;">
        {{ content.headline(displayName) }}
      </h1>
      <p class="text-base leading-relaxed mb-8 max-w-sm mx-auto" style="color: #64748B;">
        {{ content.body }}
      </p>

      <ul class="text-left max-w-xs mx-auto mb-10 flex flex-col gap-3">
        <li *ngFor="let item of content.items" class="flex items-center gap-3">
          <span class="w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0 border"
            style="background-color: #FEF3C7; border-color: #F2B705;">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <path d="M2 5l2 2 4-4" stroke="#111111" stroke-width="1.4" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </span>
          <span class="text-sm" style="color: #374151;">{{ item }}</span>
        </li>
      </ul>

      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <app-creo-btn size="lg" className="px-8" (onClick)="goTo(content.primaryRoute)">
          {{ content.primaryCta }}
        </app-creo-btn>
        <app-creo-btn variant="secondary" size="lg" className="px-8" (onClick)="goTo(content.secondaryRoute)">
          {{ content.secondaryCta }}
        </app-creo-btn>
      </div>

      <div class="mt-10 pt-8 border-t border-slate-100">
        <p class="text-xs text-slate-400">
          Servicio ofrecido por
          <span class="font-semibold" style="color: #111111;">Creo Empleos</span>
          ·
          Plataforma de matching profesional
        </p>
      </div>
    </div>
  </div>
</div>
