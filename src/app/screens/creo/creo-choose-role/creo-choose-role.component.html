<div class="min-h-screen flex flex-col items-center justify-center px-5 sm:px-8 py-10"
    style="background-color: #FAFAFA; font-family: Inter, system-ui, sans-serif">
    <div class="w-full max-w-3xl">
        <div class="flex justify-center mb-12">
            <app-creo-wordmark size="lg"></app-creo-wordmark>
        </div>

        <div class="text-center mb-10">
            <h1 class="text-[2rem] sm:text-[2.5rem] font-bold tracking-tight mb-3" style="color: #111111">
                Elige tu tipo de cuenta
            </h1>
            <p class="text-lg text-slate-500">
                Selecciona cómo quieres unirte a Creo Empleos
            </p>
        </div>

        <div class="grid md:grid-cols-2 gap-6 max-w-2xl mx-auto mb-10">
            <!-- Candidato -->
            <button type="button" (click)="goTo('register-candidate')" (mouseenter)="onCardEnter($event)"
                (mouseleave)="onCardLeave($event)"
                class="creo-role-card flex flex-col items-center text-center p-8 sm:p-10 rounded-3xl border-2 transition-all duration-200 cursor-pointer bg-white hover:-translate-y-1"
                style="border-color: #E2E8F0">
                <div class="w-20 h-20 rounded-2xl flex items-center justify-center mb-6"
                    style="background-color: #F8FAFC; color: #111111">
                    <svg width="28" height="28" viewBox="0 0 22 22" fill="none">
                        <circle cx="11" cy="7.5" r="4" stroke="currentColor" stroke-width="1.6" />
                        <path d="M3 20c0-4.418 3.582-8 8-8s8 3.582 8 8" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold mb-3" style="color: #111111">Soy Candidato</h2>
                <p class="text-sm leading-relaxed" style="color: #64748B">
                    Busco empleo y quiero mostrar mis habilidades
                </p>
            </button>

            <!-- Empresa -->
            <button type="button" (click)="goTo('register-company')" (mouseenter)="onCardEnter($event)"
                (mouseleave)="onCardLeave($event)"
                class="creo-role-card flex flex-col items-center text-center p-8 sm:p-10 rounded-3xl border-2 transition-all duration-200 cursor-pointer bg-white hover:-translate-y-1"
                style="border-color: #E2E8F0">
                <div class="w-20 h-20 rounded-2xl flex items-center justify-center mb-6"
                    style="background-color: #F8FAFC; color: #111111">
                    <svg width="28" height="28" viewBox="0 0 22 22" fill="none">
                        <rect x="3" y="9" width="16" height="11" rx="1.5" stroke="currentColor" stroke-width="1.6" />
                        <path d="M8 9V7a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" />
                        <path d="M3 13.5h16" stroke="currentColor" stroke-width="1.6" />
                        <rect x="9" y="15" width="4" height="3" rx="0.5" stroke="currentColor" stroke-width="1.2" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold mb-3" style="color: #111111">Soy Empresa</h2>
                <p class="text-sm leading-relaxed" style="color: #64748B">
                    Quiero publicar vacantes y encontrar talento
                </p>
            </button>
        </div>

        <div class="text-center">
            <p class="text-slate-500">
                ¿Ya tienes cuenta?
                <button type="button" (click)="goTo('landing')" class="font-semibold hover:underline"
                    style="color: #111111">
                    Inicia sesión
                </button>
            </p>
        </div>
    </div>
</div>
