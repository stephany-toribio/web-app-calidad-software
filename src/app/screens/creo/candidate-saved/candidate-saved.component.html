<app-candidate-shell activeScreen="candidate-saved">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-[#111111]">Guardados</h1>
        <p *ngIf="savedJobs.length > 0" class="text-sm mt-1 text-[#9A948C]">
          {{ savedJobs.length }} oferta{{ savedJobs.length !== 1 ? 's' : '' }} guardada{{ savedJobs.length !== 1 ? 's' : '' }}
        </p>
      </div>

      <button
        *ngIf="savedJobs.length > 0"
        type="button"
        (click)="exploreJobs()"
        class="text-sm font-semibold px-4 py-2 rounded-xl border cursor-pointer transition-colors border-[#E8E3D9] text-[#6B6560] hover:bg-[#F5F0E8] hover:text-[#111111]"
      >
        + Explorar más
      </button>
    </div>

    <!-- Empty State -->
    <div *ngIf="savedJobs.length === 0" class="flex flex-col items-center justify-center py-20 text-center">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-5 bg-[#F5F0E8]">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C8A84B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
        </svg>
      </div>
      <h3 class="text-lg font-bold mb-2 text-[#111111]">Sin guardados aún</h3>
      <p class="text-sm max-w-xs leading-relaxed text-[#9A948C]">
        Guarda las vacantes que más te interesen para revisarlas más tarde. Haz clic en el ícono de marcador en cualquier tarjeta.
      </p>
      <button
        type="button"
        (click)="exploreJobs()"
        class="mt-6 px-5 py-2.5 rounded-xl text-sm font-semibold cursor-pointer transition-all bg-[#F2B705] text-[#111111] hover:opacity-90 shadow-sm"
      >
        Explorar empleos
      </button>
    </div>

    <!-- Job Cards Grid -->
    <div *ngIf="savedJobs.length > 0" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <app-job-card
        *ngFor="let job of savedJobs"
        [job]="job"
        [saved]="true"
        [applied]="isApplied(job.id)"
        (toggleSave)="onToggleSave($event)"
        (viewDetail)="onViewDetail($event)"
      ></app-job-card>
    </div>
  </div>
</app-candidate-shell>
