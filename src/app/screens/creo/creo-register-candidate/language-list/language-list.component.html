<div>
  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <p class="text-[11px] font-semibold uppercase tracking-wide" style="color: #9A948C;">
      Idiomas
    </p>
    <button *ngIf="languages.length < maxLanguages" type="button" (click)="openModal()"
            class="text-sm font-semibold flex items-center gap-1.5 transition-colors"
            style="color: #D29D00;">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
        <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      {{ languages.length === 0 ? 'Agregar' : 'Sumar idioma' }}
    </button>
  </div>

  <!-- List -->
  <div class="flex flex-col gap-3 mb-6" *ngIf="languages.length > 0">
    <div *ngFor="let lang of languages; let i = index"
         (click)="openModal(i)"
         class="p-4 rounded-xl border flex justify-between items-center bg-white cursor-pointer transition-all hover:border-slate-300 relative group"
         style="border-color: #E2E8F0;">
      <div class="pr-8">
        <p class="text-sm font-semibold text-slate-800">{{ lang.idioma }}</p>
        <p class="text-xs text-slate-500">Escrito: {{ lang.nivelEscrito }} • Oral: {{ lang.nivelOral }}</p>
      </div>
      <button type="button" (click)="removeLanguage(i, $event)"
              class="absolute right-4 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-lg hover:bg-red-50 text-slate-400 hover:text-red-500 transition-all opacity-0 group-hover:opacity-100">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  </div>

  <div *ngIf="languages.length === 0" class="p-6 rounded-xl border border-dashed text-center bg-slate-50 mb-6" style="border-color: #CBD5E1;">
    <p class="text-sm text-slate-500">No has agregado ningún idioma.</p>
  </div>

  <!-- Modal -->
  <div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col">
      <!-- Header Modal -->
      <div class="px-6 py-4 border-b flex justify-between items-center" style="border-color: #F0ECD8;">
        <h3 class="text-lg font-bold text-slate-800">Sumar idioma</h3>
        <button type="button" (click)="closeModal()" class="text-slate-400 hover:text-slate-600">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Body Modal -->
      <div class="px-6 py-6 flex-1">
        <p class="text-xs text-red-500 mb-4 text-right">*Campos obligatorios</p>
        
        <div class="flex flex-col gap-4">
          <!-- Idioma -->
          <div class="relative">
            <label class="block text-sm font-medium mb-1.5" style="color: #111111;">Idioma <span class="text-xs font-semibold" style="color: #F2B705;">*</span></label>
            <input type="text" [ngModel]="currentLang.idioma" (ngModelChange)="onIdiomaChange($event)"
                   (focus)="showIdiomas = true; recargarCatalogos()" (blur)="onIdiomaBlur()"
                   placeholder="Ej. Inglés"
                   class="w-full px-3 h-11 rounded-xl border text-sm outline-none bg-white text-[#111111]"
                   [ngStyle]="{'border-color': errors['idioma'] ? '#E5140D' : '#E2E8F0'}" />
            <ul *ngIf="showIdiomas && filteredIdiomas.length > 0" 
                class="absolute left-0 right-0 top-[72px] bg-white border border-slate-200 rounded-xl shadow-lg max-h-48 overflow-y-auto z-50 py-1" style="font-family: Inter, system-ui, sans-serif;">
              <li *ngFor="let i of filteredIdiomas" (mousedown)="selectIdioma(i)"
                  class="px-4 py-2.5 text-sm text-[#111111] hover:bg-[#2563EB] hover:text-white cursor-pointer transition-colors">
                {{ i }}
              </li>
            </ul>
            <p *ngIf="errors['idioma']" class="text-xs text-red-500 mt-1">{{ errors['idioma'] }}</p>
          </div>
          
          <!-- Nivel escrito -->
          <div>
            <label class="block text-sm font-medium mb-1.5" style="color: #111111;">Nivel escrito <span class="text-xs font-semibold" style="color: #F2B705;">*</span></label>
            <select [(ngModel)]="currentLang.nivelEscrito" class="w-full px-3 h-11 rounded-xl border text-sm outline-none bg-white text-[#111111]"
                    [ngStyle]="{'border-color': errors['nivelEscrito'] ? '#E5140D' : '#E2E8F0'}">
              <option value="">Elige una opción</option>
              <option *ngFor="let n of niveles" [value]="n">{{ n }}</option>
            </select>
            <p *ngIf="errors['nivelEscrito']" class="text-xs text-red-500 mt-1">{{ errors['nivelEscrito'] }}</p>
          </div>

          <!-- Nivel oral -->
          <div>
            <label class="block text-sm font-medium mb-1.5" style="color: #111111;">Nivel oral <span class="text-xs font-semibold" style="color: #F2B705;">*</span></label>
            <select [(ngModel)]="currentLang.nivelOral" class="w-full px-3 h-11 rounded-xl border text-sm outline-none bg-white text-[#111111]"
                    [ngStyle]="{'border-color': errors['nivelOral'] ? '#E5140D' : '#E2E8F0'}">
              <option value="">Elige una opción</option>
              <option *ngFor="let n of niveles" [value]="n">{{ n }}</option>
            </select>
            <p *ngIf="errors['nivelOral']" class="text-xs text-red-500 mt-1">{{ errors['nivelOral'] }}</p>
          </div>
        </div>
      </div>

      <!-- Footer Modal -->
      <div class="px-6 py-4 border-t flex justify-between gap-3 bg-slate-50">
        <button type="button" (click)="closeModal()" class="px-4 py-2 text-sm font-semibold text-[#113264]">
          Cancelar
        </button>
        <app-creo-btn type="button" (click)="saveLanguage()">
          Guardar y continuar
        </app-creo-btn>
      </div>
    </div>
  </div>
</div>
