<div class="flex flex-col gap-3">
    <!-- Área -->
    <div>
        <label class="block text-xs font-semibold mb-1.5" style="color: #374151;">
            Área <span style="color: #E5140D;">*</span>
        </label>
        <select [value]="area" (change)="onAreaChange($event)"
            class="w-full px-3 py-2.5 rounded-xl border text-sm outline-none transition-all cursor-pointer"
            [style.border-color]="error && !area ? '#E5140D' : '#E2E8F0'"
            [style.color]="area ? '#111111' : '#94A3B8'" style="background-color: #FFFFFF;">
            <option value="" disabled>Selecciona un área</option>
            <option [value]="secundariaValue">{{ secundariaValue }}</option>
            <option disabled style="color: #CBD5E1;">──────────────────</option>
            <option *ngFor="let a of areas" [value]="a">{{ a }}</option>
        </select>
    </div>

    <!-- Especialidad + Estado (oculto si Secundaria) -->
    <ng-container *ngIf="!isSecundaria && area">
        <div class="flex flex-col sm:flex-row gap-3">
            <div class="flex-1">
                <label class="block text-xs font-semibold mb-1.5" style="color: #374151;">
                    Especialidad / Carrera <span style="color: #E5140D;">*</span>
                </label>
                <select [value]="specialty" (change)="onSpecialtyChange($event)"
                    class="w-full px-3 py-2.5 rounded-xl border text-sm outline-none transition-all cursor-pointer"
                    style="border-color: #E2E8F0; background-color: #FFFFFF;"
                    [style.color]="specialty ? '#111111' : '#94A3B8'">
                    <option value="" disabled>Selecciona una carrera</option>
                    <option *ngFor="let s of specialties" [value]="s">{{ s }}</option>
                </select>
            </div>

            <div class="flex-1">
                <label class="block text-xs font-semibold mb-1.5" style="color: #374151;">
                    Estado <span style="color: #E5140D;">*</span>
                </label>
                <select [value]="estado" (change)="onEstadoChange($event)"
                    class="w-full px-3 py-2.5 rounded-xl border text-sm outline-none transition-all cursor-pointer"
                    style="border-color: #E2E8F0; background-color: #FFFFFF;"
                    [style.color]="estado ? '#111111' : '#94A3B8'">
                    <option value="" disabled>Estado</option>
                    <option *ngFor="let e of estadoOptions" [value]="e">{{ e }}</option>
                </select>
            </div>
        </div>

        <div *ngIf="showCiclo">
            <label class="block text-xs font-semibold mb-1.5" style="color: #374151;">
                ¿En qué ciclo te quedaste?
            </label>
            <select [value]="ciclo" (change)="onCicloChange($event)"
                class="w-full px-3 py-2.5 rounded-xl border text-sm outline-none transition-all cursor-pointer"
                style="border-color: #E2E8F0; background-color: #FFFFFF;"
                [style.color]="ciclo ? '#111111' : '#94A3B8'">
                <option value="" disabled>Selecciona ciclo</option>
                <option *ngFor="let c of cicloOptions" [value]="c">{{ c }}</option>
            </select>
        </div>
    </ng-container>

    <!-- Botón agregar -->
    <button type="button" (click)="handleAdd()" [disabled]="!canAdd"
        class="self-start flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg border cursor-pointer transition-all disabled:cursor-not-allowed disabled:opacity-40"
        style="border-color: #F2B705; background-color: #FFFBEB; color: #111111;">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <path d="M6 1v10M1 6h10" />
        </svg>
        Agregar {{ isSecundaria ? 'nivel educativo' : 'carrera' }}
    </button>

    <!-- Chips -->
    <div *ngIf="careers.length > 0" class="flex flex-col gap-2">
        <p class="text-[11px] font-semibold uppercase tracking-wide" style="color: #9A948C;">Mi formación</p>
        <div class="flex flex-wrap gap-2">
            <span *ngFor="let c of careers"
                class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full"
                style="background-color: #FEF3C7; color: #111111; border: 1px solid #F2B705;">
                {{ isEntrySecundaria(c) ? secundariaValue : (c.area + ' · ' + c.specialty) }}
                <span *ngIf="!isEntrySecundaria(c)"
                    class="text-[10px] font-medium px-1.5 py-0.5 rounded-full ml-0.5 italic"
                    style="background-color: #F2B705; color: #111111;">
                    {{ c.estado }}
                </span>
                <button type="button" (click)="onRemove(c)"
                    class="ml-0.5 cursor-pointer opacity-60 hover:opacity-100 transition-opacity"
                    [attr.aria-label]="'Quitar ' + (isEntrySecundaria(c) ? secundariaValue : c.specialty)">
                    <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round">
                        <path d="M2 2l8 8M10 2l-8 8" />
                    </svg>
                </button>
            </span>
        </div>
    </div>

    <p *ngIf="error" class="text-xs" style="color: #E5140D;">{{ error }}</p>
</div>
